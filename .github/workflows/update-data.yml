name: Update Jamaica data

on:
  schedule:
    - cron: "17 11 * * *"      # daily, 7:17am New York (EDT)
  workflow_dispatch:           # "Run workflow" button for manual runs

permissions:
  contents: write
  pull-requests: write

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      # If a scraper finds bad data it exits non-zero, the run goes red,
      # GitHub emails you, and nothing is published.
      - name: Scrape MPs (Wikipedia)
        run: python -m scrapers.mps
      - name: Scrape Prime Ministers (Wikidata)
        run: python -m scrapers.pms

      - name: Summarize changes
        run: python scripts/diff_summary.py > "$RUNNER_TEMP/pr_body.md"

      # Opens (or updates) one PR only when a data file actually changed.
      # Merge it on your phone in the GitHub app to publish.
      - uses: peter-evans/create-pull-request@v7
        with:
          branch: data-update
          delete-branch: true
          commit-message: "data: automatic update"
          title: "🇯🇲 Jamaica data changed: review and merge"
          body-path: ${{ runner.temp }}/pr_body.md
          add-paths: data/*.json
          labels: data-update
